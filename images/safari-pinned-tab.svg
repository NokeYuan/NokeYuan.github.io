<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- BY monogram, styled after mentor's mark: bold white interlocked letters
       on black square, white underline bar -->
  <rect x="0" y="0" width="1000" height="1000" fill="#000000"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <!-- Y behind, shifted right so its fork peeks past the B -->
    <text x="618" y="620" font-size="560" fill="#ffffff">Y</text>
    <!-- B in front, black outline creates the interlock separation -->
    <text x="368" y="620" font-size="560" fill="#ffffff" stroke="#000000" stroke-width="22" paint-order="stroke fill">B</text>
  </g>
  <!-- underline bar -->
  <rect x="160" y="755" width="680" height="72" fill="#ffffff"/>
</svg>
